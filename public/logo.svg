<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <!-- Ultra Smooth Gold Metallic Gradient -->
    <linearGradient id="wishlynGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7db8b" />
      <stop offset="35%" stop-color="#d4af37" />
      <stop offset="70%" stop-color="#b88e28" />
      <stop offset="100%" stop-color="#8c661f" />
    </linearGradient>
    <filter id="smoothGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- WL Monogram Only - Pure Vector, Smooth Golden Metallic Finish -->
  <g transform="translate(150, 110)" fill="url(#wishlynGold)" filter="url(#smoothGlow)">
    <!-- W Monogram Letter -->
    <text 
      x="-30" 
      y="32" 
      font-family="'Cormorant Garamond', 'Playfair Display', 'Bodoni MT', 'Didot', 'Georgia', serif" 
      font-size="142" 
      font-weight="600" 
      text-anchor="middle" 
      letter-spacing="-4"
    >W</text>

    <!-- Intertwined L Monogram Letter -->
    <text 
      x="40" 
      y="24" 
      font-family="'Cormorant Garamond', 'Playfair Display', 'Bodoni MT', 'Didot', 'Georgia', serif" 
      font-size="118" 
      font-weight="500" 
      font-style="italic"
      text-anchor="middle"
    >L</text>

    <!-- Calligraphic underline swash curve -->
    <path 
      d="M -64 45 Q 0 82 76 40" 
      stroke="url(#wishlynGold)" 
      stroke-width="5" 
      fill="none" 
      stroke-linecap="round"
    />
  </g>
</svg>
